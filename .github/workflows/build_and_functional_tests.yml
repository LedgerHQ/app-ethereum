name: Build and run functional tests using ragger through reusable workflow

# This workflow will build the app and then run functional tests using the Ragger framework upon Speculos emulation.
# It calls a reusable workflow developed by Ledger's internal developer team to build the application and upload the
# resulting binaries.
# It then calls another reusable workflow to run the Ragger tests on the compiled application binary.
#
# While this workflow is optional, having functional testing on your application is mandatory and this workflow and
# tooling environment is meant to be easy to use and adapt after forking your application

on:
  workflow_dispatch:
    inputs:
      golden_run:
        type: choice
        required: true
        default: 'Raise an error (default)'
        description: CI behavior if the test snapshots are different than expected.
        options:
          - 'Raise an error (default)'
          - 'Open a PR'
  push:
    branches:
      - master
      - main
      - develop
  pull_request:

jobs:
  build_application:
    name: Build application using the reusable workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      upload_app_binaries_artifact: "ragger_elfs"
      flags: "use_test_keys"
      build_comparison: true
      enable_stack_consumption: true

  ragger_tests:
    name: Run ragger tests using the reusable workflow
    needs: build_application
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_ragger_tests.yml@v1
    with:
      download_app_binaries_artifact: "ragger_elfs"
      regenerate_snapshots: ${{ inputs.golden_run == 'Open a PR' }}
      post_stack_consumption: true

  build_clone_app:
    name: Build Clone app using the reusable workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      flags: "CHAIN=thundercore"
      upload_app_binaries_artifact: "clone_elfs"
      enable_stack_consumption: true

  ragger_clone_tests:
    name: Run ragger Clone tests using the reusable workflow
    needs:
      - build_application
      - build_clone_app
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_ragger_tests.yml@v1
    with:
      download_app_binaries_artifact: "ragger_elfs"
      additional_app_binaries_artifact: "clone_elfs"
      additional_app_binaries_artifact_dir: ./tests/functional/.test_dependencies/clone/build/
      test_options: "--setup lib_mode"
      regenerate_snapshots: ${{ inputs.golden_run == 'Open a PR' }}
      post_stack_consumption: true
      stack_consumption_section_id: "clone_app_stack_consumption"

  memory_tests:
    name: Memory profiling tests using the reusable workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_memory_profiling.yml@v1
    with:
      flags: "memory_profiling"
      run_for_devices: '["nanox"]'

  ragger_coverage:
    name: Functional tests coverage using the reusable workflow
    # Builds the app with debug symbols (dbg_use_test_keys) and runs the ragger
    # tests with coverage tracing; uploads the lcov file + HTML report as the
    # 'coverage-<device>' artifact(s) and to codecov under the 'functionaltests' flag.
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_ragger_coverage.yml@v1
    with:
      run_for_devices: '["flex"]'
      flags: "dbg_use_test_keys"
      coverage_exclude: "ethereum-plugin-sdk"
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
