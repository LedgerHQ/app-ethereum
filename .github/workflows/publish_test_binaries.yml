name: Publish swap test binaries

# Keep a rolling pre-release tagged `test-binaries`, rebuilt on every push to develop.
# It holds the test-key builds of this app, one file per use case and device, named
# `<use_case>-<device>.elf`. They are used as dependencies of the swap tests of other
# apps (see `pytest.swap.dependencies` in their `ledger_app.toml`).
# The `test-binaries` tag always points to the commit the files were built from.

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# Only the newest commit matters: stop the older run if a new push comes in.
concurrency:
  group: publish-test-binaries
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.use_case }}
    strategy:
      fail-fast: false
      matrix:
        use_case: [use_test_keys, dbg_use_test_keys]
    permissions:
      contents: read
      actions: write        # Needed for upload-artifact
      pull-requests: write  # Needed by the reusable build workflow
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      app_branch_name: ${{ github.sha }}
      use_case: ${{ matrix.use_case }}
      upload_app_binaries_artifact: test_binaries-${{ matrix.use_case }}

  upload:
    name: Update the test-binaries pre-release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: test-binaries
    steps:
      - name: Download the built binaries
        uses: actions/download-artifact@v8
        with:
          pattern: test_binaries-*
          path: binaries

      - name: Rename ELF files as <use_case>-<device>.elf
        run: |
          mkdir assets
          for elf in binaries/test_binaries-*/*/bin/app.elf; do
            use_case=$(echo "$elf" | cut -d/ -f2 | sed 's/^test_binaries-//')
            device=$(echo "$elf" | cut -d/ -f3)
            cp "$elf" "assets/${use_case}-${device}.elf"
          done
          ls -l assets

      - name: Create the tag if it does not exist yet
        run: |
          gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1 \
            || gh api --method POST "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA"

      - name: Create or update the pre-release, then upload the files
        run: |
          TITLE="Swap test binaries (develop)"
          NOTES="Test-key builds of this app, rebuilt on every push to develop. Built from commit $GITHUB_SHA. Used by the swap tests of other apps. Not a product release."
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --prerelease --title "$TITLE" --notes "$NOTES"
          else
            gh release create "$TAG" --prerelease --title "$TITLE" --notes "$NOTES" --verify-tag
          fi
          gh release upload "$TAG" assets/* --clobber

      # Last step: the tag only moves once all files are uploaded.
      - name: Move the tag to the built commit
        run: gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$TAG" -f sha="$GITHUB_SHA" -F force=true
