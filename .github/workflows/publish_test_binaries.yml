name: Publish swap test binaries

# Attach the test-key builds of the app to the GitHub release of the tag, as
# `<use_case>-<device>.elf`. They are used as dependencies of the swap tests of
# other apps (see `pytest.swap.dependencies` in their `ledger_app.toml`).

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish'
        required: true
        type: string

permissions:
  contents: read
  actions: write        # Needed for upload-artifact
  pull-requests: write  # Needed by the reusable build workflow

jobs:
  build:
    name: Build ${{ matrix.use_case }}
    strategy:
      fail-fast: false
      matrix:
        use_case: [use_test_keys, dbg_use_test_keys]
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_build.yml@v1
    with:
      # Manual runs use the tag input. A workflow triggered by a tag push has no explicit inputs, so the ref_name is used.
      app_branch_name: ${{ inputs.tag || github.ref_name }}
      use_case: ${{ matrix.use_case }}
      upload_app_binaries_artifact: test_binaries-${{ matrix.use_case }}

  upload:
    name: Upload to the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      # Manual runs use the tag input. A workflow triggered by a tag push has no explicit inputs, so the ref_name is used.
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - name: Download the built binaries
        uses: actions/download-artifact@v8
        with:
          pattern: test_binaries-*
          path: binaries

      - name: Rename ELF files as <use_case>-<device>.elf
        run: |
          mkdir assets
          for elf in binaries/test_binaries-*/*/bin/app.elf; do
            use_case=$(echo "$elf" | cut -d/ -f2 | sed 's/^test_binaries-//')
            device=$(echo "$elf" | cut -d/ -f3)
            cp "$elf" "assets/${use_case}-${device}.elf"
          done
          ls -l assets

      - name: Wait for the release of the tag, then upload
        run: |
          for _ in $(seq 60); do
            gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 && break
            sleep 30
          done
          gh release upload "$TAG" assets/* --clobber --repo "$GITHUB_REPOSITORY"
