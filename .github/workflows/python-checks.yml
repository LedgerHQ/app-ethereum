---
name: Python checks, client package build and deployment

on:
  workflow_dispatch:
  push:
    tags:
      - 'client-*'
    branches:
      - develop
      - master
    paths:
      - client/**
      - tests/functional/**
      - .github/workflows/python-checks.yml
  pull_request:
    paths:
      - client/**
      - tests/functional/**
      - .github/workflows/python-checks.yml

jobs:
  lint_client:
    name: Lint Python client
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_python_checks.yml@v1
    with:
      run_type_check: true
      src_directory: src
      setup_directory: client
      req_directory: client

  lint_tests:
    name: Lint Python tests
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_python_checks.yml@v1
    with:
      run_type_check: true
      src_directory: .
      setup_directory: tests/functional
      req_directory: tests/functional


  package_and_deploy:
    name: Build and deploy the Ethereum client Python package
    needs: [lint_client]
    uses: LedgerHQ/ledger-app-workflows/.github/workflows/reusable_pypi_deployment.yml@v1
    with:
      package_name: ledger_app_clients.ethereum
      publish: ${{ startsWith(github.ref, 'refs/tags/') }}
      package_directory: ./client/
      release: false
