# Ethereum app fuzz manifest. Schema, field meanings and how to create/update
# this file: see the "Manifest" page of the SDK Fuzzing Framework docs. One
# [[targets]] block per fuzzer built by CMakeLists.txt.

harness_version = "4"

[coverage]
exclude_regexes = [
    '.*ledger-secure-sdk.*',
    '.*fuzzing/mock/.*',
    '.*fuzzing/harness/.*',
    '.*fuzzer\.c',
    '.*src/main\.c',
    '.*src/nbgl/.*',
]

# ── fuzz_app: full-app APDU target ──────────────────────────────────────────
[[targets]]
fuzzer = "fuzz_app"
# One input is a sequence of APDUs, so it reads far past the 255 bytes a single
# payload can carry -- enough room for several full multi-chunk descriptors.
tail_budget = 1024
key_files = [
    "src/features/sign_tx/cmd_sign_tx.c",
    "src/features/sign_tx/logic_sign_tx.c",
    "src/features/sign_tx/eth_ustream.c",
    "src/features/sign_message/cmd_sign_message.c",
    "src/features/get_public_key/get_public_key.c",
    "src/features/get_public_key/cmd_get_public_key.c",
    "src/features/provide_trusted_name/cmd_trusted_name.c",
    "src/features/provide_trusted_name/trusted_name.c",
    "src/features/provide_enum_value/cmd_enum_value.c",
    "src/features/provide_enum_value/enum_value.c",
    "src/features/provide_proxy_info/proxy_info.c",
    "src/features/provide_proxy_info/cmd_proxy_info.c",
    "src/features/provide_network_info/network_info.c",
    "src/features/provide_network_info/cmd_network_info.c",
    "src/features/provide_safe_account/safe_descriptor.c",
    "src/features/provide_safe_account/signer_descriptor.c",
    "src/features/provide_safe_account/cmd_safe_account.c",
    "src/features/provide_gating/cmd_get_gating.c",
    "src/features/provide_map_entry/cmd_map_entry.c",
    "src/features/provide_map_entry/map_entry.c",
    "src/features/provide_tx_simulation/cmd_get_tx_simulation.c",
    "src/features/set_eth2_withdrawal_index/cmd_set_eth2_withdrawal_index.c",
    "src/features/get_challenge/cmd_get_challenge.c",
    "src/features/perform_privacy_operation/cmd_perform_privacy_operation.c",
    "src/features/get_eth2_public_key/cmd_get_eth2_public_key.c",
    "src/features/sign_authorization_eip7702/commands_7702.c",
    "src/features/sign_authorization_eip7702/rlp_encode.c",
    "src/features/sign_authorization_eip7702/whitelist_7702.c",
    "src/features/sign_message_eip712/eip712_v1_commands.c",
    "src/features/generic_tx_parser/cmd_tx_info.c",
    "src/features/generic_tx_parser/cmd_field.c",
    "src/tlv_apdu.c",
    "src/utils/mem_utils.c",
]
seeds = { ins = [0x02, 0x04, 0x06, 0x08, 0x0A, 0x0C, 0x0E, 0x10, 0x12, 0x14, 0x16, 0x18, 0x1A, 0x1C, 0x1E, 0x20, 0x22, 0x24, 0x26, 0x28, 0x2A, 0x30, 0x32, 0x34, 0x36, 0x38, 0x3A] }

[targets.dictionary]
tokens = [
    { name = "cla", value = "\\xE0" },
    { name = "ins_get_public_key", value = "\\xE0\\x02\\x00\\x00" },
    { name = "ins_sign", value = "\\xE0\\x04\\x00\\x00" },
