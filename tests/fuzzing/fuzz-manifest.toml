    # ArrayLevels: ARRAY_DYNAMIC=0x00 (no size) or ARRAY_FIXED_SIZE=0x01 + size byte
    #
    # uint256[] — dynamic array: encode, hash, format_hash_field_type_array_levels dynamic branch.
    { name = "sol_uint256_dyn",   value = "\\xC2\\x20\\x01\\x00" },
