    # GTP source types (for gtp_value.c)
    { name = "gtp_src_calldata", value = "\\x00" },
    { name = "gtp_src_constant", value = "\\x03\\x01\\x01" },
    { name = "gtp_src_rlp", value = "\\x03\\x01\\x02" },
    # Composite TLV fragments — complete valid sub-structures that can be
    # spliced into APDU payloads by libFuzzer token mutator. Each is a
    # full valid TLV sequence for a nested field.
    #
    # Complete data_path TLV (DATA_PATH tag 0x03 + payload containing TAG_VERSION + TAG_TUPLE)
    # Outer DATA_PATH(tag=0x03) len=7 (VERSION:3 + TUPLE:4):
    #   VERSION  0x00 0x01 0x01
    #   TUPLE    0x01 0x02 <uint16 BE offset = 0x0000>
    { name = "dp_full_tuple", value = "\\x03\\x07\\x00\\x01\\x01\\x01\\x02\\x00\\x00" },
    # TUPLE with non-zero offset (increases data_path->size + distinct path bytes).
    { name = "dp_full_tuple_10", value = "\\x03\\x07\\x00\\x01\\x01\\x01\\x02\\x00\\x10" },
    # LEAF_TYPE_STATIC (0x03) — path_leaf success path (static chunk consumer).
    # Outer DATA_PATH(tag=0x03) len=6 (VERSION:3 + LEAF:3):
    #   VERSION  0x00 0x01 0x01
    #   LEAF     0x04 0x01 0x03
    { name = "dp_full_leaf",     value = "\\x03\\x06\\x00\\x01\\x01\\x04\\x01\\x03" },
    # LEAF_TYPE_DYNAMIC (0x04) — path_leaf success path (dynamic size via calldata chunk).
    { name = "dp_full_leaf_dyn", value = "\\x03\\x06\\x00\\x01\\x01\\x04\\x01\\x04" },
    # LEAF_TYPE_ARRAY (0x01) / LEAF_TYPE_TUPLE (0x02) — default branch of path_leaf switch.
    { name = "dp_full_leaf_arr", value = "\\x03\\x06\\x00\\x01\\x01\\x04\\x01\\x01" },
    { name = "dp_full_leaf_tup", value = "\\x03\\x06\\x00\\x01\\x01\\x04\\x01\\x02" },
    # Complete data_path TLV with ARRAY element (ARRAY body has WEIGHT+START+END sub-TLVs).
    # Outer DATA_PATH(tag=0x03) len=0x10 (16):
    #   VERSION   0x00 0x01 0x01
    #   ARRAY     0x02 0x0B + WEIGHT(0x01 0x01 0x02) START(0x02 0x02 0x00 0x00) END(0x03 0x02 0x00 0x02)
    { name = "dp_full_array", value = "\\x03\\x10\\x00\\x01\\x01\\x02\\x0B\\x01\\x01\\x02\\x02\\x02\\x00\\x00\\x03\\x02\\x00\\x02" },
    # ARRAY variant exercising only WEIGHT (no start/end → array_size drives passes).
    { name = "dp_full_array_w", value = "\\x03\\x08\\x00\\x01\\x01\\x02\\x03\\x01\\x01\\x01" },
    # Complete data_path TLV with SLICE element (SLICE body has START+END sub-TLVs).
    # Outer DATA_PATH(tag=0x03) len=0x0D (13):
    #   VERSION   0x00 0x01 0x01
    #   SLICE     0x05 0x08 + START(0x01 0x02 0x00 0x00) END(0x02 0x02 0x00 0x02)
    { name = "dp_full_slice", value = "\\x03\\x0D\\x00\\x01\\x01\\x05\\x08\\x01\\x02\\x00\\x00\\x02\\x02\\x00\\x02" },
    # Multi-element DATA_PATH: VERSION + TUPLE + LEAF_STATIC — exercises path_tuple then path_leaf
    # in data_path_get's switch loop (both increment size, hitting 2 iterations).
    { name = "dp_tuple_leaf", value = "\\x03\\x0A\\x00\\x01\\x01\\x01\\x02\\x00\\x00\\x04\\x01\\x03" },
    # Multi-element DATA_PATH: VERSION + ARRAY_W + LEAF_DYNAMIC — hits path_array then path_leaf.
    { name = "dp_array_leaf", value = "\\x03\\x0B\\x00\\x01\\x01\\x02\\x03\\x01\\x01\\x01\\x04\\x01\\x04" },
    # Complete data_path TLV with REF element
    { name = "dp_full_ref", value = "\\x03\\x05\\x00\\x01\\x01\\x03\\x00" },
    # Complete value TLV with VERSION + TYPE_FAMILY + TYPE_SIZE (minimal fuzzable value)
    { name = "value_uint_min", value = "\\x00\\x01\\x01\\x01\\x01\\x01\\x02\\x01\\x20" },
    # TAG_TYPE_SIZE variants: format_int/format_uint switch on type_size*8 (8/16/32/64/128/256).
    # Intermediate sizes fall to default (return false) but cover the switch arm code.
    { name = "type_size_1",  value = "\\x02\\x01\\x01" },
    { name = "type_size_2",  value = "\\x02\\x01\\x02" },
    { name = "type_size_4",  value = "\\x02\\x01\\x04" },
    { name = "type_size_8",  value = "\\x02\\x01\\x08" },
    { name = "type_size_16", value = "\\x02\\x01\\x10" },
    { name = "type_size_3",  value = "\\x02\\x01\\x03" },
    { name = "type_size_15", value = "\\x02\\x01\\x0F" },
    # Complete value TLV with VERSION + TYPE_FAMILY + DATA_PATH
    { name = "value_addr_dp", value = "\\x00\\x01\\x01\\x01\\x01\\x05\\x03\\x08\\x00\\x01\\x01\\x04\\x01\\x00" },
    # Complete PARAM_AMOUNT payload: version + value_wrapper + name
    { name = "param_amount_full", value = "\\x00\\x01\\x01\\x01\\x0D\\x00\\x01\\x01\\x01\\x01\\x01\\x02\\x01\\x20\\x02\\x04test" },
    # TAG_NAME with short value (common in many param types)
    { name = "tag_name_short", value = "\\x02\\x04test" },
    # TAG_VALUE wrapper containing valid VALUE TLV
    { name = "tag_value_wrapper", value = "\\x03\\x09\\x00\\x01\\x01\\x01\\x01\\x01\\x02\\x01\\x20" },
    # Minimal VALUE with CONSTANT source (tag 0x05 + 8 bytes of 0).
    { name = "value_const_u64", value = "\\x00\\x01\\x01\\x01\\x01\\x01\\x02\\x01\\x08\\x05\\x08\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x01" },
    # Minimal VALUE with CONSTANT source of 20 bytes (address).
    { name = "value_const_addr", value = "\\x00\\x01\\x01\\x01\\x01\\x05\\x02\\x01\\x14\\x05\\x14\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01" },
    # Minimal VALUE pointing to RLP container (CP_TO) — exercises value_get RLP arm.
    { name = "value_rlp_to",    value = "\\x00\\x01\\x01\\x01\\x01\\x05\\x02\\x01\\x14\\x04\\x01\\x01" },
    # Minimal VALUE pointing to RLP container (CP_VALUE) — amount path.
    { name = "value_rlp_value", value = "\\x00\\x01\\x01\\x01\\x01\\x01\\x02\\x01\\x20\\x04\\x01\\x02" },
    # Minimal VALUE pointing to RLP container (CP_CHAIN_ID) — hits get_current_tx_info().
    { name = "value_rlp_chain", value = "\\x00\\x01\\x01\\x01\\x01\\x01\\x02\\x01\\x08\\x04\\x01\\x03" },
    # PARAM_CALLDATA composite: VERSION + VALUE + CALLEE + SELECTOR + AMOUNT, nested VALUEs.
    # Outer byte layout (each inner VALUE has 3+3+3+body = hdr+body bytes):
    #   VERSION    0x00 0x01 0x01                                      (3 bytes)
    #   VALUE      0x01 0x0B  VERSION(3) FAMILY(3) SIZE(3) CONST0(2)   (13 bytes)
    #   CALLEE     0x02 0x1F  VERSION(3) FAMILY(3) SIZE(3) CONST20(22) (33 bytes)
    #   SELECTOR   0x04 0x0F  VERSION(3) FAMILY(3) SIZE(3) CONST4(6)   (17 bytes)
    #   AMOUNT     0x05 0x0C  VERSION(3) FAMILY(3) SIZE(3) CP_VAL(3)   (14 bytes)
    { name = "param_calldata_multi", value = "\\x00\\x01\\x01\\x01\\x0B\\x00\\x01\\x01\\x01\\x01\\x07\\x02\\x01\\x00\\x05\\x00\\x02\\x1F\\x00\\x01\\x01\\x01\\x01\\x05\\x02\\x01\\x14\\x05\\x14\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x01\\x04\\x0F\\x00\\x01\\x01\\x01\\x01\\x07\\x02\\x01\\x04\\x05\\x04\\xa9\\x05\\x9c\\xbb\\x05\\x0C\\x00\\x01\\x01\\x01\\x01\\x01\\x02\\x01\\x20\\x04\\x01\\x02" },
    # GTP field message root template (TAG_VERSION 0x00 + TAG_NAME 0x01 + TAG_PARAM_TYPE 0x02)
    { name = "field_root_raw", value = "\\x00\\x01\\x01\\x01\\x04test\\x02\\x01\\x00" },
    # FIELD TLV layout (tags): 0x00 VERSION, 0x01 NAME, 0x02 PARAM_TYPE,
    # 0x03 PARAM(body), 0x04 VISIBLE, 0x05 CONSTRAINT.
    # PARAM body for PARAM_TYPE_RAW is PARAM_RAW (tags 0x00 VERSION, 0x01 VALUE).
    # VALUE (tags 0x00 VERSION, 0x01 TYPE_FAMILY, 0x02 TYPE_SIZE, plus one source:
    # 0x03 DATA_PATH, 0x04 CONTAINER_PATH, 0x05 CONSTANT).
    #
    # field_full_raw: FIELD with PARAM_TYPE=RAW and VALUE using CP_VALUE RLP source.
    # VERSION(3) + NAME(6) + PARAM_TYPE(3) + PARAM(2+len=18):
    #   PARAM body = PARAM_RAW: VERSION(3) + TAG_VALUE(2+len=13):
    #     VALUE: VERSION(3) + TYPE_FAMILY(3) + TYPE_SIZE(3) + CP(3) = 12 -> wait +2 hdr
    #   VALUE body 12: 0x00 0x01 0x01  0x01 0x01 0x01  0x02 0x01 0x20  0x04 0x01 0x02
    #   TAG_VALUE: 0x01 0x0C <value body 12>
    #   PARAM_RAW body: 0x00 0x01 0x01 + 0x01 0x0C <value 12> = 3 + 14 = 17
    #   TAG_PARAM: 0x03 0x11 <17 bytes>
    { name = "field_full_raw",    value = "\\x00\\x01\\x01\\x01\\x04test\\x02\\x01\\x00\\x03\\x11\\x00\\x01\\x01\\x01\\x0C\\x00\\x01\\x01\\x01\\x01\\x01\\x02\\x01\\x20\\x04\\x01\\x02" },
