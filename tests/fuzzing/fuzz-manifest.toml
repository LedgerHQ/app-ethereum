    { name = "eip712_p2_def_field", value = "\\xFF" },
    # EIP-712 field type descriptors (TypeDesc byte for set_struct_field).
    # Layout: TypeDesc (1B, low-nibble=e_type, 0x40=TYPESIZE, 0x80=ARRAY) + optional TypeSize
