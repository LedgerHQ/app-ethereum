    # field_raw_not_in: FIELD + VISIBLE=IF_NOT_IN(2) + CONSTRAINT 32 bytes of 0 (uint256 cmp).
    { name = "field_raw_not_in",  value = "\\x00\\x01\\x01\\x01\\x04test\\x02\\x01\\x00\\x03\\x11\\x00\\x01\\x01\\x01\\x0C\\x00\\x01\\x01\\x01\\x01\\x01\\x02\\x01\\x20\\x04\\x01\\x02\\x04\\x01\\x02\\x05\\x20\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00" },
    # field_addr_must_be: FIELD with TYPE_FAMILY=ADDRESS (5) + CONSTRAINT 20 bytes (format_addr path).
    #   VALUE body: VER(3) FAMILY=5(3) SIZE=20(3) CP_TO(3) = 12
    { name = "field_addr_must_be",value = "\\x00\\x01\\x01\\x01\\x04test\\x02\\x01\\x00\\x03\\x11\\x00\\x01\\x01\\x01\\x0C\\x00\\x01\\x01\\x01\\x01\\x05\\x02\\x01\\x14\\x04\\x01\\x01\\x04\\x01\\x01\\x05\\x14\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00" },
    # field_bytes_must_be: FIELD with TYPE_FAMILY=BYTES (4) + CONSTRAINT 4 bytes (format_bytes path).
    { name = "field_bytes_must_be",value = "\\x00\\x01\\x01\\x01\\x04test\\x02\\x01\\x00\\x03\\x11\\x00\\x01\\x01\\x01\\x0C\\x00\\x01\\x01\\x01\\x01\\x04\\x02\\x01\\x04\\x04\\x01\\x02\\x04\\x01\\x01\\x05\\x04\\xaa\\xbb\\xcc\\xdd" },
    # field_bool: FIELD with TYPE_FAMILY=BOOL (3) (format_bool path).
    { name = "field_bool",        value = "\\x00\\x01\\x01\\x01\\x04test\\x02\\x01\\x00\\x03\\x11\\x00\\x01\\x01\\x01\\x0C\\x00\\x01\\x01\\x01\\x01\\x03\\x02\\x01\\x01\\x04\\x01\\x02" },
    # field_string: FIELD with TYPE_FAMILY=STRING (6) (format_string path).
    { name = "field_string",      value = "\\x00\\x01\\x01\\x01\\x04test\\x02\\x01\\x00\\x03\\x11\\x00\\x01\\x01\\x01\\x0C\\x00\\x01\\x01\\x01\\x01\\x06\\x02\\x01\\x20\\x04\\x01\\x02" },
    # TRUSTED_NAME: struct_type, version, challenge, type=account, source=ens, address
