# ── fuzz_plugin: internal plugins driven through the plugin interface ───────
[[targets]]
fuzzer = "fuzz_plugin"
# The harness builds a txContent then feeds the rest as 32-byte ABI words, so
# it reads well past the 255 bytes a single APDU payload can carry.
tail_budget = 512
key_files = [
    "src/plugins/eth_plugin_handler.c",
    "src/plugins/plugins.c",
    "src/plugins/erc20/erc20_plugin.c",
    "src/plugins/erc721/erc721_plugin.c",
    "src/plugins/erc721/erc721_provide_parameters.c",
    "src/plugins/erc721/erc721_ui.c",
    "src/plugins/erc1155/erc1155_plugin.c",
    "src/plugins/erc1155/erc1155_provide_parameters.c",
    "src/plugins/erc1155/erc1155_ui.c",
    "src/plugins/eth2/eth2_plugin.c",
    "src/plugins/eip7002/eip7002_plugin.c",
    "src/plugins/eip7251/eip7251_plugin.c",
    "src/plugins/swap_with_calldata/swap_with_calldata_plugin.c",
    "src/swap/eth_swap_utils.c",
    "ethereum-plugin-sdk/src/plugin_utils.c",
]
seeds = { ins = [0x00, 0x01, 0x02, 0x03, 0x04, 0x05, 0x06] }

# ERC-721 and ERC-1155 keep their selector tables private, so the fuzzer needs
# them here rather than as a second copy in the harness.
[targets.dictionary]
tokens = [
    { name = "erc721_approve", value = "\\x09\\x5e\\xa7\\xb3" },
    { name = "erc721_approve_for_all", value = "\\xa2\\x2c\\xb4\\x65" },
    { name = "erc721_transfer_from", value = "\\x23\\xb8\\x72\\xdd" },
    { name = "erc721_safe_transfer", value = "\\x42\\x84\\x2e\\x0e" },
    { name = "erc721_safe_transfer_data", value = "\\xb8\\x8d\\x4f\\xde" },
    { name = "erc1155_safe_transfer", value = "\\xf2\\x42\\x43\\x2a" },
    { name = "erc1155_safe_batch_transfer", value = "\\x2e\\xb2\\xc2\\xd6" },
]
