    #   VALUE body 42: VER(3) + FAMILY(3) + SIZE(3) + CONST32(2+32=34) = 43 -> recount
    #   Actually VER(3) FAMILY(3) SIZE(3) = 9; CONSTANT header 0x05 0x20 + 32 bytes = 34; total 43.
    #   TAG_VALUE: 0x01 0x2B <value body 43> = 45 bytes total
    #   PARAM_RAW body: 0x00 0x01 0x01 + 0x01 0x2B <43> = 48
    #   TAG_PARAM: 0x03 0x30 <48 bytes>
    { name = "field_raw_const",   value = "\\x00\\x01\\x01\\x01\\x04test\\x02\\x01\\x00\\x03\\x30\\x00\\x01\\x01\\x01\\x2B\\x00\\x01\\x01\\x01\\x01\\x01\\x02\\x01\\x20\\x05\\x20\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00" },
    # field_raw_must_be: FIELD + VISIBLE=MUST_BE(1) + CONSTRAINT(1 byte = 0) using CP_VALUE.
