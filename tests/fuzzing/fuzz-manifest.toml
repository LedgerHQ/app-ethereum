[target]
fuzzer = "fuzz_app"
# App-local input ABI version for the Ethereum harness and seeds. Bump this
# only when the fuzz input contract changes in a way that invalidates older
# corpora.
harness_version = "1"

# Track the Absolution prefix offset of `appState` in scenario_layout.h so the
# custom seed generator can set the app-state byte regardless of prefix
# compaction (domain-overrides shrink the prefix and would break fixed offsets).
[layout]
extra_args = [
    "--global", "appState:SCEN_APPSTATE_OFF",
]

