    { name = "sol_uint16",   value = "\\x42\\x02" },
    { name = "sol_uint32",   value = "\\x42\\x04" },
    { name = "sol_uint64",   value = "\\x42\\x08" },
    { name = "sol_uint128",  value = "\\x42\\x10" },
