    # string[] — ARRAY without TYPESIZE.
    { name = "sol_string_dyn",    value = "\\x85\\x01\\x00" },
    # bytes[] (dynamic) — ARRAY without TYPESIZE.
    { name = "sol_bytes_arr_dyn", value = "\\x87\\x01\\x00" },
    # bytes32[] — ARRAY with TYPESIZE + level count + dynamic.
    { name = "sol_bytes32_dyn",   value = "\\xC6\\x20\\x01\\x00" },
    # int256[3] — fixed-size int array.
    { name = "sol_int256_fix3",   value = "\\xC1\\x20\\x01\\x01\\x03" },
